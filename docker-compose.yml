services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: conektafinance-backend
    restart: always
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${CONEKTA_POSTGRES_DB};Username=${CONEKTA_POSTGRES_USER};Password=${CONEKTA_POSTGRES_PASSWORD}
      Evolution__Instance: conekta
    volumes:
      - uploads_data:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # A imagem aspnet nao tem curl/wget: o teste usa o /dev/tcp do bash.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Banco da aplicacao (API, web e PWA). Porta publicada apenas no localhost
  # para desenvolvimento local (dotnet run) e administracao via psql.
  postgres:
    image: postgres:16-alpine
    container_name: conektafinance-postgres
    restart: always
    environment:
      POSTGRES_DB: ${CONEKTA_POSTGRES_DB}
      POSTGRES_USER: ${CONEKTA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CONEKTA_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Backup diario do banco da aplicacao (pg_dump em formato custom), mantendo os
  # ultimos BACKUP_RETENTION arquivos. Restauracao: ver database/README.md.
  postgres-backup:
    image: postgres:16-alpine
    container_name: conektafinance-postgres-backup
    restart: always
    environment:
      PGHOST: postgres
      PGUSER: ${CONEKTA_POSTGRES_USER}
      PGPASSWORD: ${CONEKTA_POSTGRES_PASSWORD}
      PGDATABASE: ${CONEKTA_POSTGRES_DB}
      BACKUP_INTERVAL_SECONDS: "86400"
      BACKUP_RETENTION: "7"
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          file="/backups/conektafinance-$$(date -u +%Y%m%d-%H%M%S).dump"
          if pg_dump -Fc -f "$$file"; then echo "Backup gerado: $$file"; else echo "Falha no backup"; fi
          ls -1t /backups/*.dump 2>/dev/null | tail -n +$$((BACKUP_RETENTION + 1)) | xargs -r rm -f
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: conektafinance-frontend
    restart: always
    ports:
      - "9001:80"
    labels:
      - "traefik.docker.network=dokploy-network"
    networks:
      - default
      - dokploy-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # Canal WhatsApp (Evolution API v2 sobre Baileys) + dependencias obrigatorias
  # (PostgreSQL e Redis). O webhook trafega pela rede interna do compose:
  # evolution -> http://backend:8080/api/v1/webhooks/whatsapp
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: conektafinance-evolution
    restart: always
    env_file:
      - .env
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      SERVER_URL: ${EVOLUTION_SERVER_URL}
      DEL_INSTANCE: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_POSTGRES_USER}:${EVOLUTION_POSTGRES_PASSWORD}@evolution-postgres:5432/${EVOLUTION_POSTGRES_DB}
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379
      CACHE_LOCAL_ENABLED: "false"
    ports:
      - "8082:8080"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - evolution-postgres
      - evolution-redis
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  evolution-postgres:
    image: postgres:16-alpine
    container_name: conektafinance-evolution-postgres
    restart: always
    environment:
      POSTGRES_DB: ${EVOLUTION_POSTGRES_DB}
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  evolution-redis:
    image: redis:7-alpine
    container_name: conektafinance-evolution-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local
  uploads_data:
    driver: local
  evolution_instances:
    driver: local
  evolution_postgres_data:
    driver: local
  evolution_redis_data:
    driver: local

networks:
  dokploy-network:
    external: true
