services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conektafinance-backend
    restart: always
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - sqlite_data:/app/data
      - uploads_data:/app/wwwroot/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: conektafinance-frontend
    restart: always
    ports:
      - "9001:80"
    labels:
      - "traefik.docker.network=dokploy-network"
    networks:
      - default
      - dokploy-network
    depends_on:
      - backend

volumes:
  sqlite_data:
    driver: local
  uploads_data:
    driver: local

networks:
  dokploy-network:
    external: true
