name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restaurar dependências
        run: dotnet restore
      - name: Compilar
        run: dotnet build --no-restore
      - name: Testar
        run: dotnet test tests/PIM-III-Backend.Tests.csproj --no-build --logger "console;verbosity=normal"

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testar
        run: npm test
      - name: Build
        run: npm run build

  database:
    name: Banco de dados (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: conektafinance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
      PGDATABASE: conektafinance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Instalar dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.7
      - name: Verificar se os scripts gerados estão atualizados
        run: |
          ./database/build.sh
          git diff --exit-code -- database/01_schema.sql database/conektafinance.sql
      - name: Executar script completo
        run: psql -v ON_ERROR_STOP=1 -q -f database/conektafinance.sql
      - name: Testes de procedures e triggers
        run: |
          for test in database/tests/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$test"
          done
