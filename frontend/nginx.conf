server {
    listen 80;
    server_name _;

    # Proxy reverso para as APIs REST do Backend ASP.NET Core
    location /api {
        proxy_pass http://backend:8080/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'keep-alive';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Arquivos enviados pelo backend (avatars, notas fiscais do assistente)
    location /uploads {
        proxy_pass http://backend:8080/uploads;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # Distribuição do PWA estático
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Caching inteligente para Service Worker e Manifesto PWA
    location /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        expires 0;
    }

    location /manifest.webmanifest {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        expires 0;
    }

    # Otimização de entrega com compressão Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
