server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;

    # DNS interno do Docker: o IP do backend e resolvido a cada 10s, entao o proxy
    # continua funcionando quando o container e recriado ou escalado.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8080;

    # Proxy reverso para as APIs REST do Backend ASP.NET Core (suporta /api/v1/ e /api/)
    location /api/v1/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'keep-alive';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /api/v1/$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'keep-alive';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Arquivos enviados pelo backend (avatars, notas fiscais do assistente)
    location /uploads {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # Distribuição do PWA estático
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Caching inteligente para Service Worker e Manifesto PWA
    location /sw.js {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        expires 0;
    }

    location /manifest.webmanifest {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        expires 0;
    }

    # Otimização de entrega com compressão Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
